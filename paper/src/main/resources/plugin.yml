name: PaperTimeFreeze
version: 1.0.0
main: com.papertimefreeze.PaperTimeFreeze
api-version: '1.20'
description: 无人时暂停昼夜循环与天气变化，有人时自动恢复
author: ima.copilot

commands:
  papertimefreeze:
    description: PaperTimeFreeze 主命令
    usage: /papertimefreeze <reload|status>
    aliases: [ptf]
    permission: papertimefreeze.admin

permissions:
  papertimefreeze.admin:
    description: 允许使用 PaperTimeFreeze 管理命令
    default: op
